<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Thirty</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Thirty">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1E22">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

#app[data-theme="light"]{
  --bg:#F1F4FC; --card:#FFFFFF; --ink:#131A2C; --body:#3F4A66; --muted:#78829E;
  --line:#E5E9F4; --track:#EDF1F8; --accent:#4F46E5; --accent-soft:#EEEDFF;
  --gold:#B8860B; --gold-bg:#FFF6E0; --good:#0F7A55; --good-bg:#E7F7F0;
  --shadow:0 1px 2px rgba(19,26,44,.05), 0 12px 28px -20px rgba(19,26,44,.5);
}
#app[data-theme="dark"]{
  --bg:#0D1220; --card:#161E2F; --ink:#EDF1FA; --body:#BFC8DE; --muted:#8590AB;
  --line:#232D45; --track:#1D2639; --accent:#8B84FF; --accent-soft:#221F45;
  --gold:#F0C060; --gold-bg:#2B2413; --good:#4FD8A3; --good-bg:#102B23;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  min-height:100%;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font-family:inherit;color:inherit;font-size:16px}
h1,h2,h3,h4{margin:0;font-family:'Outfit',system-ui,sans-serif;letter-spacing:-.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.shell{max-width:470px;margin:0 auto;min-height:100vh;position:relative}

/* ── header ── */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 18px 11px;
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.hdr .who{flex:1;min-width:0}
.hdr h1{font-size:17px;font-weight:800;line-height:1.1}
.hdr .sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.hbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);background:var(--card);flex:none}
.hbtn:active{background:var(--track)}
.hbtn svg{width:17px;height:17px}

/* ── views ── */
.view{padding:16px 18px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.sect{margin-bottom:16px}
.sect>h2{font-size:13px;font-weight:700;letter-spacing:.01em;margin-bottom:9px;color:var(--body)}
.sect>h2 span{float:right;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.06em}

/* ── date strip ── */
.dstrip{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dstrip .nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;color:var(--muted);flex:none;font-size:17px}
.dstrip .nav:disabled{opacity:.32}
.dstrip .mid{flex:1;text-align:center}
.dstrip .mid b{display:block;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700}
.dstrip .mid span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;color:var(--muted)}

/* ── hero ── */
.hero{padding:20px 18px 18px;text-align:center;margin-bottom:14px}
.ringbox{display:grid;place-items:center;margin-bottom:10px}
.ring text.big{font-family:'Outfit',sans-serif;font-weight:800;font-size:38px;fill:var(--ink)}
.ring text.sm{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:var(--muted)}
.ring text.cell{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;fill:var(--body)}
.ring circle{transition:stroke .3s}
.hero .msg{font-size:13.5px;color:var(--body);line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.chip.perfect{background:var(--good-bg);color:var(--good)}
.chip.star{background:var(--gold-bg);color:var(--gold)}
.starrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:11px}

/* ── habit cards ── */
.hab{padding:14px 15px;margin-bottom:10px}
.habtop{display:flex;align-items:center;gap:12px}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.habmain{flex:1;min-width:0}
.habmain .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.habmain .s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.check{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;
  flex:none;color:transparent;transition:.16s;background:var(--card)}
.check.on{color:#fff;border-color:transparent}
.check svg{width:17px;height:17px}
.bar{height:5px;border-radius:4px;background:var(--track);margin-top:11px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.stepper{display:flex;align-items:center;gap:8px;margin-top:12px}
.stepper .sq{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:20px;font-weight:600;color:var(--body);flex:none;background:var(--bg)}
.stepper .sq:active{background:var(--track)}
.numin{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;
  font-family:'IBM Plex Mono',monospace;font-size:16px;text-align:center;outline:none;font-weight:500}
.numin:focus{border-color:var(--accent);background:var(--card)}
.segs{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.seg{flex:1;min-width:66px;padding:11px 6px;border-radius:12px;border:1.5px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg);text-align:center}
.seg.on{color:#fff;border-color:transparent}
.seg{min-width:62px}
.seg.extra{border-style:dashed;flex-basis:100%}
.seg.extra.on{background:var(--gold)!important;color:#1a1405}
.overchip{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 10px;border-radius:999px;
  background:var(--gold-bg);color:var(--gold);font-size:11px;font-weight:700}
.noteline{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  font-size:15px;outline:none;margin-top:4px}
.noteline:focus{border-color:var(--accent)}
.locked{padding:46px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}

/* ── calendar ── */
.cal{padding:15px 13px 16px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px}
.dow div{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{padding:6px 0 5px;border-radius:13px;border:1.5px solid transparent;display:grid;justify-items:center;gap:3px}
.day.sel{border-color:var(--accent)}
.day.today{background:var(--accent-soft)}
.day.future{opacity:.35}
.day .dl{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--muted)}
.day.blank{visibility:hidden}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.leg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--body)}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}

/* ── kpis / panels ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{padding:14px 15px}
.kpi .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted)}
.kpi .v{font-family:'Outfit',sans-serif;font-size:29px;font-weight:800;line-height:1.05;margin-top:7px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:11px;color:var(--muted);margin-top:4px}
.panel{padding:16px 16px 17px;margin-bottom:14px}
.panel h3{font-size:15px;font-weight:700}
.panel .ph{font-size:11.5px;color:var(--muted);margin:4px 0 14px;line-height:1.45}
.hrow{margin-bottom:13px}
.hrow:last-child{margin-bottom:0}
.hrow .top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hrow .top i{width:8px;height:8px;border-radius:3px;flex:none}
.hrow .top span{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--muted)}

/* ── coach ── */
.coach{padding:18px 17px;margin-bottom:14px}
.coachhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cavatar{width:74px;height:74px;border-radius:20px;flex:none;overflow:hidden;box-shadow:var(--shadow)}
.cbfig{display:block;width:100%;height:100%}
.cbphoto{position:relative;width:100%;height:100%;overflow:hidden;border-radius:20px;background:var(--track)}
.cbphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.chero{position:relative;overflow:hidden;display:flex;gap:8px;align-items:flex-end;border-radius:20px;
  margin-bottom:18px;background:linear-gradient(145deg,var(--accent),#12A594);box-shadow:var(--shadow)}
.chero .txt{flex:1;padding:18px 4px 18px 18px;color:#fff}
.chero .txt h3{font-size:19px;font-weight:800;letter-spacing:-.02em}
.chero .txt p{margin:7px 0 0;font-size:12.5px;line-height:1.55;opacity:.94}
.chero img{width:140px;height:auto;display:block;align-self:flex-end;margin:0 -4px -1px 0;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.finish{padding:20px 18px;margin-bottom:14px;background:linear-gradient(150deg,var(--accent),#12A594);
  border:none;color:#fff;text-align:center}
.finish .fk{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;opacity:.85}
.finish h3{font-size:25px;font-weight:800;margin:7px 0 4px}
.finish .fsub{font-size:13px;line-height:1.5;opacity:.95;margin-bottom:15px}
.fstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:17px}
.fstats div{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 4px}
.fstats b{display:block;font-family:'Outfit',sans-serif;font-size:19px;font-weight:800;line-height:1.1}
.fstats span{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.07em;opacity:.85}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.exgrid button{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 3px;color:#fff}
.exgrid button:active{background:rgba(255,255,255,.3)}
.exgrid b{display:block;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800}
.exgrid span{font-size:9.5px;opacity:.85}
.fdone{width:100%;padding:13px;border-radius:13px;background:#fff;color:var(--accent);font-weight:800;font-size:14.5px}
.warn{background:var(--gold-bg);color:var(--gold);border-radius:12px;padding:11px 13px;font-size:11.5px;
  line-height:1.5;margin-top:12px;font-weight:500}
.upload{display:flex;gap:12px;align-items:center}
.upload .prev{width:66px;height:66px;border-radius:18px;overflow:hidden;flex:none;background:var(--track)}
.upload .prev img{width:100%;height:100%;object-fit:cover;display:block}
.slab b{color:var(--ink);font-weight:500}
.tone{display:flex;gap:6px;margin:14px 0 0}
.tone button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font-size:11.5px;font-weight:700;color:var(--muted)}
.tone button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bio{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.bio:first-of-type{border-top:none}
.bio .bk{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);width:74px;flex:none;padding-top:2px}
.bio .bv{font-size:13px;line-height:1.5;color:var(--body);flex:1}
.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  font-family:inherit;font-size:15px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.field select:focus{border-color:var(--accent)}
.coachhead h3{font-size:17px;font-weight:800}
.coachhead .r{font-size:11px;color:var(--muted);margin-top:2px}
.verdict{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;line-height:1.25;margin-bottom:10px;letter-spacing:-.02em}
.coachtext{font-size:14px;line-height:1.62;color:var(--body)}
.coachtext p{margin:0 0 11px}
.coachtext p:last-child{margin:0}
.callout{border-left:3px solid var(--accent);padding:2px 0 2px 13px;margin:14px 0 0}
.callout .cl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}
.callout .cv{font-size:13.5px;line-height:1.5;color:var(--ink);font-weight:500}
.callout.warn{border-color:var(--gold)}
.callout.win{border-color:var(--good)}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.94)}
.btn:disabled{opacity:.55}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.week7{display:flex;gap:5px;margin-top:14px;align-items:flex-end;height:52px}
.week7 div{flex:1;background:var(--track);border-radius:4px;position:relative;display:flex;align-items:flex-end}
.week7 div i{display:block;width:100%;border-radius:4px;background:var(--accent)}

/* ── weight ── */
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:13px}
.wk{padding:9px 4px;border-radius:11px;background:var(--bg);text-align:center;border:1px solid var(--line)}
.wk.done{background:var(--good-bg);border-color:transparent}
.wk .n{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;color:var(--muted)}
.wk .w{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;margin-top:3px}
.wk.done .w{color:var(--good)}
.winput{display:flex;gap:8px;margin-top:13px}
.winput input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;
  font-family:'IBM Plex Mono',monospace;font-size:16px;text-align:center;outline:none}
.winput input:focus{border-color:var(--accent)}
.winput button{padding:0 20px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;flex:none}
.unit{display:flex;gap:3px;background:var(--track);padding:3px;border-radius:10px}
.unit button{padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.unit button.on{background:var(--card);color:var(--ink)}
.delta{font-family:'Outfit',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em}

/* ── tabs ── */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;max-width:470px;margin:0 auto}
.tab{flex:1;display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted)}
.tab.on{color:var(--accent)}
.tab svg{width:21px;height:21px}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:.01em}

/* ── setup / settings ── */
.setup{padding:26px 18px calc(40px + env(safe-area-inset-bottom))}
.setup h2{font-size:26px;font-weight:800;margin-bottom:8px}
.setup .intro{font-size:14px;color:var(--body);line-height:1.6;margin:0 0 20px}
.field{margin-bottom:14px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;color:var(--muted);margin-bottom:7px}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none}
.field input:focus{border-color:var(--accent)}
.rulecard{padding:4px 15px;margin-bottom:18px}
.rulerow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.rulerow:first-child{border-top:none}
.row2{display:flex;gap:9px;margin-top:9px}
.row2 button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;
  padding:11px 17px;border-radius:12px;z-index:60;transition:.2s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.saveflag{position:fixed;top:14px;right:0;left:0;margin:0 auto;width:fit-content;z-index:50;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:999px;opacity:0;transition:.2s}
.saveflag.show{opacity:1}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div id="app" data-theme="light"><div class="shell"><div class="locked">Opening your log…</div></div></div>
<div class="toast" id="toast"></div>
<div class="saveflag mono" id="saveflag">SAVED</div>

<script>
(function(){
const app=document.getElementById('app'), toastEl=document.getElementById('toast'), flag=document.getElementById('saveflag');
const KEY='challenge:v3', OLD2='challenge:v2', OLD1='challenge:v1';

const HUE={
  light:{food:'#17A673',steps:'#2E7DF6',fit:'#EC4899',aero:'#E5484D',pages:'#F59E0B',off:'#8B5CF6'},
  dark: {food:'#2BC792',steps:'#5C9CFF',fit:'#FF74B4',aero:'#FF7A7E',pages:'#FFB43D',off:'#A78BFA'}
};
const ICON={
  food:'<path d="M6 3v8a2 2 0 0 0 4 0V3M8 13v8M17.5 3c-1.4 1.9-2 3.8-2 5.8 0 1.6.7 2.4 2 2.4V21"/>',
  steps:'<circle cx="13" cy="4.5" r="2"/><path d="M13 6.5v5l-3.5 9M13 11.5l3.5 2.5.8 5M9.5 9l6-.8"/>',
  fit:'<path d="M6.5 8v8M3.5 10.5v3M17.5 8v8M20.5 10.5v3M6.5 12h11"/>',
  aero:'<path d="M20.6 6.1a4.7 4.7 0 0 0-6.7 0L12 8l-1.9-1.9a4.7 4.7 0 0 0-6.7 6.7L12 21l8.6-8.2a4.7 4.7 0 0 0 0-6.7Z"/><path d="M4.2 12.3h3.3l1.4-2.4 2.1 4.8 1.6-2.4h6.9"/>',
  pages:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M8 8h7M8 12h5"/>',
  off:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2M3.5 3.5l17 17"/>'
};
const TASKS=[
  {id:'food', t:'Whole foods only',  s:'Meat, vegetables, fruit, grain — nothing processed'},
  {id:'steps',t:'10,000 steps',      s:'Log your count',type:'num',goal:10000,inc:500,quick:[1000,2500],unit:'steps',
   tiers:[[12500,1],[15000,2],[20000,3]]},
  {id:'fit',  t:'Stretch, push, pull, legs',s:'All four earn the point. Anything extra earns a star.',type:'seg'},
  {id:'aero', t:'20 minutes aerobic', s:'Anything that lifts your heart rate and holds it there',type:'num',goal:20,inc:5,quick:[10,20],unit:'minutes',

const DB={
  mode:'memory', mem:{},
  init(){
    try{ const k='__probe__'; localStorage.setItem(k,'ok');
      const back=localStorage.getItem(k); localStorage.removeItem(k);
      if(back==='ok'){ this.mode='local'; return this.mode; } }catch(e){}
    this.mode=(typeof window!=='undefined'&&window.storage&&window.storage.get)?'cloud':'memory';
    return this.mode;
  },
  selftest(){
    const k='__selftest__', v='t'+Date.now();
    try{ if(this.mode!=='local')return false;
      localStorage.setItem(k,v); const ok=localStorage.getItem(k)===v; localStorage.removeItem(k); return ok;
    }catch(e){ return false; }
  },
  read(k){
    if(this.mode==='local'){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
    return this.mem[k]!==undefined?this.mem[k]:null;
  },
  async readAsync(k){
    if(this.mode==='cloud'){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
    return this.read(k);
  },
  write(k,v){
    this.mem[k]=v;
    if(this.mode==='local'){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
    if(this.mode==='cloud'){ try{ window.storage.set(k,v); return true; }catch(e){ return false; } }
    return false;
  },
  remove(k){
    delete this.mem[k];
    if(this.mode==='local'){ try{ localStorage.removeItem(k); }catch(e){} }
    else if(this.mode==='cloud'){ try{ window.storage.delete(k); }catch(e){} }
  },
  label(){ return this.mode==='local'?'Saving to this device'
    : this.mode==='cloud'?'Saving to the preview sandbox'
    : 'NOT SAVING — this browser is blocking storage'; }
};

const blank=()=>({food:false,steps:'',stretch:false,push:false,pull:false,legs:false,extra:false,aero:'',pages:'',off:false,note:''});
function rec(i){ if(!S.log[i])S.log[i]=blank(); const r=S.log[i];
  if(r.legs===undefined)r.legs=false; if(r.aero===undefined)r.aero='';
  return r; }
function done(r,id){
  if(id==='food')return !!r.food;
  if(id==='off')return !!r.off;
  if(id==='steps')return Number(r.steps||0)>=10000;
  if(id==='pages')return Number(r.pages||0)>=10;

const states=i=>TASKS.map(t=>done(rec(i),t.id));
const score=i=>states(i).filter(Boolean).length;
function starsFor(i){
  const r=rec(i); let n=0, why=[];
  TASKS.forEach(t=>{ if(!t.tiers)return;
    const v=Number(r[t.id]||0); let got=0;
    t.tiers.forEach(([need,pts])=>{ if(v>=need)got=pts; });
    if(got){ n+=got; why.push({id:t.id,n:got,txt:v.toLocaleString()+' '+t.unit}); }
  });
  if(r.extra&&done(r,'fit')){ n+=1; why.push({id:'fit',n:1,txt:'extra session'}); }
  return {n,why};
}
function stats(){
  const last=Math.min(LAST(),ti()), o={pts:0,perfect:0,streak:0,best:0,stars:0,elapsed:Math.max(0,Math.min(LEN(),ti()+1)),rates:{},daily:[]};
  TASKS.forEach(t=>o.rates[t.id]=0);
  let run=0;
  for(let i=0;i<=last;i++){
    const r=rec(i), sc=score(i);
    TASKS.forEach(t=>{ if(done(r,t.id)){o.pts++;o.rates[t.id]++;} });
    o.stars+=starsFor(i).n; o.daily.push(sc);
    if(sc===TOTAL){o.perfect++;run++;o.best=Math.max(o.best,run);} else run=0;
  }
  for(let i=last;i>=0;i--){ if(score(i)===TOTAL)o.streak++; else break; }
  o.pct=o.elapsed?Math.round(o.pts/(o.elapsed*TOTAL)*100):0;
  return o;
}

function ring(st,size,sw,center){

  let s=`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${c} ${c})">`;
  for(let i=0;i<TOTAL;i++)s+=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--track)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${vis} ${C-vis}" stroke-dashoffset="${-i*seg}"/>`;
  for(let i=0;i<TOTAL;i++) if(st[i])s+=`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${hue(TASKS[i].id)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${vis} ${C-vis}" stroke-dashoffset="${-i*seg}"/>`;
  return s+'</g>'+(center||'')+'</svg>';
}

function fileToFace(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej();
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const N=360, c=document.createElement('canvas'); c.width=c.height=N;
        const x=c.getContext('2d'), s=Math.min(img.width,img.height);
        x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N);
        res(c.toDataURL('image/jpeg',.86)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function report(){
  const st=stats(), d=ti(), n=first(S.name), R={st};
  const el=st.elapsed;
  if(el===0){ R.verdict='Day one is waiting.'; R.body=[`Everything is set, ${n}. The plan is written and the calendar is built — all that's left is the first day of doing it. Show up tomorrow and the rest gets easier.`]; R.notes=[]; return R; }
  const rates=TASKS.map(t=>({t,r:st.rates[t.id]/el}));
  const weak=rates.slice().sort((a,b)=>a.r-b.r)[0], strong=rates.slice().sort((a,b)=>b.r-a.r)[0];
  const recent=st.daily.slice(-7), prior=st.daily.slice(-14,-7);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const trend=avg(recent)-avg(prior);
  R.verdict = st.pct>=95?'You are running this thing.'
    : st.pct>=85?'Strong and steady.'
    : st.pct>=70?'Solid, with room to close.'
    : st.pct>=50?'Half in. Time to pick a side.'
    : 'This is the week it turns.';
  const body=[];
  body.push(`${el} day${el===1?'':'s'} in, ${n}, and you have earned ${st.pts} of a possible ${el*TOTAL} points — ${st.pct}%. ${st.perfect} perfect day${st.perfect===1?'':'s'}${st.best>1?`, with a best run of ${st.best} straight`:''}.`);
  if(st.streak>=3) body.push(`You are on ${st.streak} perfect days in a row right now. That is the part worth protecting — streaks are how a decision becomes a default.`);
  else if(st.streak===0&&el>1) body.push(`The streak is at zero, which is not a verdict, just a starting point. One clean day resets it.`);
  if(strong.r>=.8) body.push(`${strong.t.t} is your anchor at ${Math.round(strong.r*100)}%. Whatever you are doing to protect that one, copy it onto the habit below.`);
  if(weak.r<.7) body.push(`${weak.t.t} is the leak at ${Math.round(weak.r*100)}%. It is costing you more points than everything else combined, and it is the one I want you to defend this week.`);
  if(prior.length&&trend<=-.6) body.push(`Fair warning: your last seven days average ${avg(recent).toFixed(1)} out of ${TOTAL}, down from ${avg(prior).toFixed(1)}. That is drift, and drift is easier to fix now than in week four.`);
  else if(prior.length&&trend>=.6) body.push(`Your last seven days average ${avg(recent).toFixed(1)}, up from ${avg(prior).toFixed(1)}. You are accelerating into the back half.`);
  if(st.stars>=5) body.push(`And you have banked ${st.stars} stars going past the minimum. Nobody required that. It counts.`);
  R.body=body;
  const notes=[];
  if(strong.r>=.6)notes.push({k:'STRONGEST',v:`${strong.t.t} — ${Math.round(strong.r*100)}% of days`,c:'win'});
  if(weak.r<1)notes.push({k:'THIS WEEK\u2019S CHALLENGE',v:`Take ${weak.t.t} to seven straight days. ${weak.t.id==='steps'?'Put the walk on the calendar like a meeting.':weak.t.id==='pages'?'Ten pages before the phone comes on.':weak.t.id==='off'?'Move the apps off the home screen for the rest of the month.':weak.t.id==='food'?'Decide tomorrow\u2019s meals tonight, not at noon.':'Do the three movements first thing, before the day gets a vote.'}`,c:'warn'});
  const todayLeft=d>=0&&d<=LAST()?TASKS.filter(t=>!done(rec(Math.min(LAST(),d)),t.id)):[];
  if(todayLeft.length)notes.push({k:'STILL OPEN TODAY',v:todayLeft.map(t=>t.t).join(' · '),c:''});
  else if(d>=0&&d<=LAST())notes.push({k:'TODAY',v:`Closed out at ${TOTAL} of ${TOTAL}. Go rest.`,c:'win'});
  const w=weightList();
  if(w.length>=2){
    const ch=w[w.length-1].w-w[0].w, dir=ch<0?'down':ch>0?'up':'level';
    notes.push({k:'BODY DATA',v:`${Math.abs(ch).toFixed(1)} ${S.unit} ${dir} from your baseline across ${w.length} weigh-ins. One number among several — the habit bars are the steadier signal.`,c:''});
  } else if(el>=7&&w.length<2) notes.push({k:'MISSING',v:'No weekly weigh-in logged yet. Same day, same time, once a week is all it takes.',c:'warn'});
  R.notes=notes;
  const sg=TONE[S.tone||'balanced'].sign;
  R.body.push(sg[(el+st.perfect)%sg.length]);
  return R;
}

function habCard(t,r){

    extra=`<div class="bar"><i style="width:${pct}%;background:${col}"></i></div>

      </div>

      <button class="seg extra ${r.extra?'on':''}" data-seg="extra" title="Optional — earns a star, not a point">+ Extra</button>
    </div>`;
  }
  const sub=t.type==='num'?`${v.toLocaleString()} of ${t.goal.toLocaleString()} ${t.unit}`:t.s;
  return `<div class="card hab">

}

function scoreChart(a){
  const W=520,H=170,L=24,R=6,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const x=i=>L+i/Math.max(1,LAST())*iw, y=v=>T+ih-(v/TOTAL*ih);
  if(!a.length)return `<div class="ph" style="text-align:center;padding:26px 0">Scores appear here once day one begins.</div>`;
  let g='';
  for(let v=0;v<=TOTAL;v++)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  Array.from(new Set([0,Math.round(LAST()*.25),Math.round(LAST()*.5),Math.round(LAST()*.75),LAST()])).forEach(i=>{ g+=`<text class="lbl" x="${x(i)}" y="${H-5}" text-anchor="middle">${i+1}</text>`; });
  const pts=a.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const dots=a.map((v,i)=>v===TOTAL?`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--good)"/>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
}
function weightChart(w){
  const W=520,H=150,L=34,R=8,T=12,B=20,iw=W-L-R,ih=H-T-B;
  const vals=w.map(p=>p.w), lo=Math.min(...vals), hi=Math.max(...vals), pad=Math.max(.5,(hi-lo)*.25);
  const y=v=>T+ih-((v-(lo-pad))/((hi+pad)-(lo-pad))*ih), x=i=>L+i/Math.max(1,LAST())*iw;
  const pts=w.map(p=>`${x(p.i).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:14px">
    <line class="gl" x1="${L}" x2="${W-R}" y1="${y(hi)}" y2="${y(hi)}"/><text class="lbl" x="${L-6}" y="${y(hi)+3}" text-anchor="end">${hi}</text>
    <line class="gl" x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}"/><text class="lbl" x="${L-6}" y="${y(lo)+3}" text-anchor="end">${lo}</text>
    <polyline points="${pts}" fill="none" stroke="var(--good)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${w.map(p=>`<circle cx="${x(p.i)}" cy="${y(p.w)}" r="3.4" fill="var(--good)"/><text class="lbl" x="${x(p.i)}" y="${H-4}" text-anchor="middle">d${p.i+1}</text>`).join('')}</svg>`;
}

    </div>
    <div class="card panel"><h3>Your data</h3>
      <p class="ph">Status: <b style="color:${DB.mode==='local'?'var(--good)':'var(--gold)'}">${DB.label()}</b>.
      ${DB.mode==='local'?'Everything saves the moment you tap, and stays on this device.'
        :'Two usual causes: Private Browsing, or Settings → Apps → Safari → Advanced → Block All Cookies being switched on.'}</p>
      <button class="btn sub" id="stest" style="margin-bottom:10px">Test saving now</button>
      <div class="row2" style="margin-top:0"><button class="btn sub" id="csv">Copy as CSV</button>
      <button class="btn sub" id="reset" style="color:#D9534F">Erase all</button></div>
    </div>
    <button class="btn" id="backtab">Done</button>
    <div class="ph" style="text-align:center;margin-top:16px;letter-spacing:.1em;font-family:'IBM Plex Mono',monospace;font-size:9.5px">THE THIRTY · v2.0</div>`;
}

/* ── wiring ── */
function wire(){
  const d=ti();
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  const one=(id,f)=>{ const e=document.getElementById(id); if(e)e.onclick=f; };
  one('prev',()=>{ sel=Math.max(0,sel-1); renderView(); });
  one('next',()=>{ sel=Math.min(LAST(),sel+1); renderView(); });
  q('[data-day]',b=>b.onclick=()=>{ sel=+b.dataset.day; view='today'; window.scrollTo(0,0); renderView(); });
  q('[data-check]',b=>b.onclick=()=>{
    const id=b.dataset.check, r=rec(sel), t=TASKS.find(x=>x.id===id);
    if(t.type==='num') r[id]=done(r,id)?'':String(t.goal);
    else if(t.type==='seg'){ const all=r.stretch&&r.push&&r.pull&&r.legs; r.stretch=r.push=r.pull=r.legs=!all; }
    else r[id]=!r[id];
    save(); bump(); renderView();
  });
  q('[data-seg]',b=>b.onclick=()=>{ const r=rec(sel); r[b.dataset.seg]=!r[b.dataset.seg]; save(); bump(); renderView(); });
  q('[data-inc]',b=>b.onclick=()=>{ const r=rec(sel), id=b.dataset.inc;
    r[id]=String(Math.max(0,Number(r[id]||0)+Number(b.dataset.n))); save(); bump(); renderView(); });
  q('[data-num]',inp=>{ inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-9]/g,''); rec(sel)[inp.dataset.num]=inp.value; save(); live(); };
    inp.onblur=()=>renderView(); });
  const nt=document.querySelector('[data-note]'); if(nt)nt.oninput=()=>{ rec(sel).note=nt.value; save(); };
  q('[data-ext]',b=>b.onclick=()=>{
    const n=Number(b.dataset.ext);
    S.len=Math.min(MAXLEN,LEN()+n); S.done=false; save();
    toast('Extended to '+LEN()+' days. Day '+(ti()+1)+' is next.');
    view='today'; window.scrollTo(0,0); render();
  });
  one('finish',()=>{ S.done=true; save(); toast('Challenge complete.'); view='progress'; window.scrollTo(0,0); render(); });
  one('newround',()=>{
    if(!confirm('Start a new round? This clears the current log and weigh-ins. Copy your CSV first if you want to keep it.'))return;
    S.log={}; S.weights={}; S.coach=null; S.len=30; S.done=false; S.start=iso(today());
    sel=0; celebrated={}; save(); view='today'; render();
  });
  q('[data-por]',b=>b.onclick=()=>{ const p=b.dataset.por;
    if(p==='custom'&&!CUSTOM){ const f=document.getElementById('facefile'); if(f){f.click();return;} }
    S.portrait=p; save(); renderView(); });
  const pick=document.getElementById('pick'), ff=document.getElementById('facefile');
  if(pick&&ff)pick.onclick=()=>ff.click();
  if(ff)ff.onchange=async()=>{
    const f=ff.files&&ff.files[0]; if(!f)return;
    try{ const url=await fileToFace(f); await saveFace(url); S.portrait='custom'; save();
      toast('That is Coach Barnabas now.'); renderView(); }
    catch(e){ toast('Could not read that image. Try a JPEG or PNG.'); }
  };
  one('wsave',()=>{
    const el=document.getElementById('wval'), v=parseFloat(el.value);
    if(!v||v<=0){ toast('Enter a weight to log it'); return; }
    S.weights=S.weights||{}; S.weights[Math.min(LAST(),Math.max(0,ti()))]=Math.round(v*10)/10; save();
    toast('Weigh-in logged for day '+(Math.min(LAST(),Math.max(0,ti()))+1)); renderView();
  });
  q('[data-unit]',b=>b.onclick=()=>{ S.unit=b.dataset.unit; save(); renderView(); });
  q('[data-theme-set]',b=>b.onclick=()=>{ S.theme=b.dataset.themeSet; save(); render(); });
  one('settings2',()=>{ view='settings'; window.scrollTo(0,0); renderView(); });
  one('backtab',()=>{ view='today'; window.scrollTo(0,0); renderView(); });
  one('stest',()=>{
    if(!DB.selftest()){ toast('Not saving. Check Private Browsing and Block All Cookies.'); return; }
    flush(); const b=DB.read(KEY);
    toast(b&&b.length>20?'Working — '+(Math.round(b.length/1024*10)/10)+' KB saved on this device.':'Wrote, but read back empty.');
  });
  one('csv',csv);
  one('reset',async()=>{
    if(!confirm('Erase every logged day, weigh-in and note? This cannot be undone.'))return;
    DB.remove(KEY);
    S=null; sel=0; view='today'; celebrated={}; render();
  });
  const sn=document.getElementById('sname'); if(sn)sn.oninput=()=>{ S.name=sn.value; save(); };
  const sd=document.getElementById('sdate'); if(sd)sd.onchange=()=>{ if(sd.value){ S.start=sd.value; sel=Math.min(LAST(),Math.max(0,ti())); save(); render(); } };
}
function live(){
  const st=states(sel), sc=score(sel), hr=document.getElementById('heroring');
  if(hr)hr.innerHTML=ring(st,180,16,`<text class="big" x="50%" y="46%" text-anchor="middle" dominant-baseline="central">${sc}</text><text class="sm" x="50%" y="64%" text-anchor="middle" dominant-baseline="central">OF ${TOTAL}</text>`);
  document.querySelectorAll('[data-num]').forEach(inp=>{
    const t=TASKS.find(x=>x.id===inp.dataset.num), card=inp.closest('.hab'), v=Number(rec(sel)[t.id]||0);
    const bar=card.querySelector('.bar i'), sub=card.querySelector('.habmain .s'), chk=card.querySelector('.check');
    if(bar)bar.style.width=Math.min(100,Math.round(v/t.goal*100))+'%';
    if(sub)sub.textContent=`${v.toLocaleString()} of ${t.goal.toLocaleString()} ${t.unit}`;
    if(chk){ const on=done(rec(sel),t.id); chk.classList.toggle('on',on); chk.style.background=on?hue(t.id):''; }
  });
}
function bump(){
  if(score(sel)===TOTAL&&!celebrated[sel]){ celebrated[sel]=1;
    setTimeout(()=>{ const h=document.getElementById('heroring'); if(h)h.classList.add('pop'); },20);
    const s=starsFor(sel).n;
    toast(s?`Perfect day — and ${s} star${s===1?'':'s'} on top.`:'Perfect day. All five closed.');
  }
}

function csv(){
  const rows=[['Day','Date','WholeFoods','Steps','Stretch','Push','Pull','Legs','Extra','Aerobic','Pages','NoSocial','Score','Stars','Weight('+S.unit+')','Note']];
  for(let i=0;i<LEN();i++){ const r=rec(i);
    rows.push([i+1,iso(addD(parseD(S.start),i)),r.food?1:0,r.steps||0,r.stretch?1:0,r.push?1:0,r.pull?1:0,r.legs?1:0,r.extra?1:0,
      r.aero||0,r.pages||0,r.off?1:0,score(i),starsFor(i).n,(S.weights&&S.weights[i])||'',r.note||'']);
  }
  const text=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');
  const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied — paste into Excel, Numbers or Sheets'); }
  catch(e){ toast('Copy blocked by the browser'); }
  ta.remove();
}

/* ── setup ── */
function setup(){
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  app.dataset.theme=dark?'dark':'light';
  const tmp={theme:dark?'dark':'light'}; S=null;
  const h=id=>HUE[dark?'dark':'light'][id];
  app.querySelector('.shell').innerHTML=`<div class="setup">
    <h2>The Thirty</h2>
    <p class="intro">Six habits, every day, for thirty days. Each one is worth a point — six points is a perfect day, 180 across the month. Anything past the minimum earns stars instead, so going long never raises the bar.</p>
    <div class="card rulecard">${TASKS.map(t=>`<div class="rulerow">
      <div class="tile" style="background:${h(t.id)}22">${ico(ICON[t.id],h(t.id),21)}</div>
      <div class="habmain"><div class="t">${t.t}</div><div class="s">${t.s}</div></div></div>`).join('')}</div>
    <div class="chero">
      <div class="txt">
        <h3>Coach Barnabas</h3>
        <p>He reads your log every day, tells you what's working, and tells you the truth when it isn't. He'll say it out loud if you want him to.</p>
      </div>
      <img src="${COACH_FULL}" alt="Coach Barnabas">
    </div>
    <div class="field"><label>YOUR NAME</label><input id="n" placeholder="What should Coach Barnabas call you?" maxlength="24"></div>
    <div class="field"><label>START DATE</label><input id="sd" type="date" value="${iso(today())}"></div>
    ${DB.mode!=='local'?`<div class="warn" style="margin:0 0 14px">This browser is blocking storage, so nothing you log will be kept. Turn off Private Browsing, and check Settings → Apps → Safari → Advanced → Block All Cookies is off.</div>`:''}
    <button class="btn" id="go">Begin the thirty days</button>
  </div>`;
  document.getElementById('go').onclick=()=>{
    const sd=document.getElementById('sd').value;
    if(!sd){ toast('Pick a start date to continue'); return; }
    S={name:document.getElementById('n').value.trim()||'',start:sd,log:{},weights:{},unit:'lb',theme:tmp.theme,tone:'balanced',portrait:'coach',len:30,done:false};
    sel=Math.min(LAST(),Math.max(0,ti())); view='today'; flush(); render();
  };
}

(async()=>{
  DB.init();
  S=await load();
  await loadFace();
  if(S){ S.log=S.log||{}; S.weights=S.weights||{}; S.unit=S.unit||'lb'; S.tone=S.tone||'balanced';
    S.portrait=S.portrait||'coach'; S.len=S.len||30;
    if(!S.theme)S.theme=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    sel=Math.min(LAST(),Math.max(0,ti())); }
  render();
})();
})();
</script>
